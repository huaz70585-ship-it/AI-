<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 途灵 · 矢量版 logo（2026-09-24 影像层重绘）：
       忠实原 logo.png 的三要素——空心起点环 / 蜿蜒路线+中段圆珠 / 实心终点+四尖灵光星。
       曲线重拉顺、星形四尖利落；原 PNG 保留未删，换回只需把引用改回 /logo.png -->
  <g fill="none" stroke="#2AA7B0">
    <!-- 起点：空心环 -->
    <circle cx="17.5" cy="47.5" r="5.4" stroke-width="4.4"/>
    <!-- 路线：环上方出发 → 小弯收势 → 中段圆珠 → 爬升到终点 -->
    <path d="M18.8 41.5 C17.2 45.8 22.2 46.8 25.4 44.2 C28.6 41.6 27.4 38.6 30.6 35.6 C34.2 32.2 35.4 27.4 39.8 23.4 C41.6 21.8 42.6 20.6 43.6 19.4" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- 中段圆珠（路线的顿挫） -->
  <circle cx="30.6" cy="35.6" r="4" fill="#2AA7B0"/>
  <!-- 终点：实心圆 -->
  <circle cx="44.6" cy="17.6" r="6.6" fill="#2AA7B0"/>
  <!-- 灵光星：四尖 -->
  <path d="M24.5 13.5 Q25.4 19.1 31 20 Q25.4 20.9 24.5 26.5 Q23.6 20.9 18 20 Q23.6 19.1 24.5 13.5 Z" fill="#2AA7B0"/>
</svg>
